server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    # 文本资源压缩（nginx 默认 gzip_types 只含 text/html，JS/CSS/JSON 一直没压）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml;

    # 基础安全响应头（应用层也有一份，双保险）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # 单 IP 30 r/s、突发 100；超限返回 429（nginx 默认是 503）
        limit_req zone=wordisle_api burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式接口（视频/批量编译进度）：关闭缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
