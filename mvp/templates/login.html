<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · WordIsle 托业单词</title>
<style>
  :root {
    --bg: #f5f5f7;
    --bg-card: #ffffff;
    --accent: #3a7d6a;
    --accent-dark: #2a6654;
    --accent-soft: #e8f3ee;
    --text-primary: #1d1d1f;
    --text-secondary: #5b5b6b;
    --text-tertiary: #8e8e9e;
    --border-default: rgba(0,0,0,0.07);
    --danger: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, var(--accent-soft), transparent 60%),
                var(--bg);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--bg-card);
    border: 1px solid var(--border-default);
    border-radius: 16px;
    padding: 32px 28px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.06);
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .brand h1 { font-size: 22px; color: var(--text-primary); letter-spacing: 0.5px; }
  .brand p { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; font-size: 14px; cursor: pointer;
    border-radius: 10px; color: var(--text-secondary); user-select: none;
    background: var(--bg);
  }
  .tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin: 14px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border-default); outline: none; background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(58,125,106,0.12); }
  .btn {
    width: 100%; margin-top: 20px; padding: 12px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer; color: #fff; background: var(--accent);
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: var(--accent-soft); color: var(--accent-dark); margin-top: 10px; }
  .btn.secondary:hover { background: #dbece4; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .err { display: none; margin-top: 14px; padding: 9px 12px; font-size: 13px; color: var(--danger); background: rgba(192,57,43,0.07); border-radius: 8px; }
  .guest-tip { margin-top: 16px; padding: 10px 12px; font-size: 12px; color: var(--text-tertiary); background: var(--bg); border-radius: 8px; line-height: 1.6; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--text-tertiary); font-size: 12px; margin: 18px 0 2px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-default); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>🌊 WordIsle</h1>
    <p>托业顽固词 · 深度加工系统</p>
  </div>

  <form id="form-account" onsubmit="return doLogin(event)">
    <label for="username">账号（开发者 / 管理员）</label>
    <input type="text" id="username" autocomplete="username" placeholder="请输入账号" required>
    <label for="password">密码</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" required>
    <button class="btn" id="btn-account" type="submit">登 录</button>
    <div class="err" id="err-account"></div>
  </form>

  <div class="divider">或</div>
  <button class="btn secondary" id="btn-guest" type="button" onclick="guestLogin()">游客直接进入</button>
  <div class="err" id="err-guest"></div>
  <div class="guest-tip">⚠ 游客数据保存在当前浏览器（Cookie 30 天有效）。<br>清除缓存或更换设备后将无法找回，重要数据请使用开发者/管理员账号。</div>
</div>

<script>
function showErr(id, msg) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.textContent = msg;
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-account');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    if (resp.ok) { location.href = '/'; return; }
    const data = await resp.json().catch(() => ({}));
    showErr('err-account', data.detail || '登录失败，请稍后重试');
  } catch (err) {
    showErr('err-account', '网络错误，请稍后重试');
  } finally {
    btn.disabled = false;
  }
}

async function guestLogin() {
  const btn = document.getElementById('btn-guest');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/login-guest', { method: 'POST' });
    if (resp.ok) { location.href = '/'; return; }
    const data = await resp.json().catch(() => ({}));
    showErr('err-guest', data.detail || '进入失败，请稍后重试');
  } catch (err) {
    showErr('err-guest', '网络错误，请稍后重试');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
